<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カネリョウ最終面接GAMBA</title>
<style>
:root{
  --bg:#f4f7fc; --card:#ffffff; --ink:#1f2a3d; --sub:#5b6880;
  --blue:#1f5fbf; --blue-d:#163f86; --blue-l:#e3ecfa;
  --sun:#ffc23c; --sun-l:#fff5d6; --coral:#e8473c; --coral-l:#fde6e3;
  --mint:#2fb383; --mint-l:#ddf5ea; --line:#d5deec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.8;font-size:16px}
header{background:linear-gradient(135deg,#163f86 0%,#1f5fbf 55%,#e8473c 100%);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:.04em}
header p{margin:2px 0 0;font-size:13px;opacity:.95}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:6px 8px}
nav button{flex:0 0 auto;border:0;background:var(--blue-l);color:var(--blue-d);font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;font-family:inherit}
nav button.on{background:var(--blue);color:#fff}
main{max-width:860px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
h2{font-size:19px;margin:0 0 8px;color:var(--blue-d)}
h3{font-size:16px;margin:14px 0 4px;color:var(--ink)}
.warn{background:var(--coral-l);border:2px solid var(--coral);border-radius:14px;padding:14px}
.warn b{color:#b8322a}
.tip{background:var(--sun-l);border-left:6px solid var(--sun);padding:10px 12px;border-radius:8px;margin:10px 0}
.ok{background:var(--mint-l);border-left:6px solid var(--mint);padding:10px 12px;border-radius:8px;margin:10px 0}
.btn{display:inline-block;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:12px 20px;border-radius:12px;cursor:pointer;font-family:inherit;text-decoration:none;margin:3px 0}
.btn.sun{background:var(--sun);color:#5a4200}
.btn.red{background:var(--coral)}
.btn.mint{background:var(--mint)}
.btn.line{background:#fff;color:var(--blue-d);border:2px solid var(--blue)}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.rec{background:var(--coral);animation:pulse 1.2s ease-in-out infinite}
.star{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--coral-l);color:#b8322a;margin-left:4px}
.ref{background:#f6f8fb;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
summary{cursor:pointer}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(232,71,60,.25)}}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
.tile{display:block;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;cursor:pointer;font-family:inherit;color:inherit;font-size:15px;width:100%}
.tile:hover{border-color:var(--blue)}
.tile .ic{font-size:26px}
.tile b{display:block;font-size:17px;color:var(--blue-d)}
label{display:block;font-weight:700;margin:14px 0 4px}
input[type=text],select,textarea{width:100%;font-size:16px;font-family:inherit;border:2px solid var(--line);border-radius:10px;padding:10px;background:#fcfdff;color:var(--ink)}
textarea{min-height:92px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;background:var(--blue-l);border-radius:999px;padding:6px 12px}
.chk input{width:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
.pill{background:var(--sun-l);border:1px solid var(--sun);border-radius:999px;padding:2px 10px;font-size:13px}
.pill.must{background:var(--coral-l);border-color:var(--coral);color:#b8322a;font-weight:700}
.small{font-size:13px;color:var(--sub)}
.hide{display:none!important}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--mint)}
.stars{color:#f0a500;letter-spacing:1px;font-size:14px}
.done-badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--mint-l);color:#1b7d59;margin-left:6px}
.chip{display:inline-block;border:1px solid var(--blue);background:#fff;color:var(--blue-d);border-radius:999px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.5}
.chip:hover{background:var(--blue-l)}
.hintbox{background:#fff;border:2px solid var(--sun);border-radius:14px;padding:12px;margin:10px 0}
.kata{border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.kata b{color:var(--blue-d)}
.loading{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue-d)}
.spin{width:22px;height:22px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 基礎知識 */
.kn ul{margin:6px 0 6px 20px;padding:0}
.kn li{margin:3px 0}
.say{background:var(--blue-l);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.src{font-size:12px;color:var(--sub)}
.quiz-c{display:block;width:100%;text-align:left;margin:6px 0;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:16px;cursor:pointer;color:inherit}
.quiz-c:hover{border-color:var(--blue)}
.quiz-c.right{border-color:var(--mint);background:var(--mint-l)}
.quiz-c.wrong{border-color:var(--coral);background:var(--coral-l)}
.cardq{font-size:18px;font-weight:700;border:2px solid var(--blue);border-radius:14px;padding:14px;background:#fff}

/* 質問 */
.qhead{display:flex;gap:8px;align-items:flex-start}
.qno{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:0 8px}
.qtext{font-size:19px;font-weight:700;line-height:1.6;color:var(--blue-d)}
.qtext.deep{color:#b8322a}
.qitem{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;cursor:pointer;font-family:inherit;font-size:15px;color:inherit}
.qitem:hover{background:var(--blue-l)}
.timebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.timebox .sec{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px}
.meter{flex:1 1 160px;height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--sun)}
.meter i.good{background:var(--mint)}
.meter i.over{background:var(--coral)}
.interim{color:var(--sub);font-size:14px;min-height:1.6em}

/* 結果 */
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font-size:52px;font-weight:800;line-height:1}
.score .big small{font-size:18px;color:var(--sub)}
.lv{font-weight:700;border-radius:999px;padding:4px 14px}
.lv.a{background:var(--mint-l);color:#1b7d59}.lv.b{background:var(--sun-l);color:#7a5a00}.lv.c{background:var(--coral-l);color:#b8322a}
table.bd{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.bd th,table.bd td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.bd th{background:var(--blue-l);color:var(--blue-d)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:3px;min-width:60px}
.bar i{display:block;height:100%;background:var(--blue)}
.fix{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.fix .o{background:#f3f4f6;border-radius:8px;padding:4px 8px;text-decoration:line-through;text-decoration-color:var(--coral)}
.fix .r{background:var(--blue-l);border-radius:8px;padding:4px 8px;color:var(--blue-d);font-weight:700;margin-top:4px}
.hyouka{background:#fff;border:2px solid var(--blue);border-radius:12px;padding:10px 12px}
.model{white-space:pre-wrap;font-family:inherit;background:var(--mint-l);border-radius:12px;padding:12px;margin:6px 0;line-height:1.9}
.deepbox{background:var(--coral-l);border:2px solid var(--coral);border-radius:12px;padding:10px 12px;margin:10px 0}

@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;font-size:12px}
  main{padding:0;max-width:none}
  .card{border:1px solid #999;break-inside:avoid}
  .model,.hyouka,.fix .r,table.bd th,.bar i,.lv,.say{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<body>
<header>
  <h1>🌊 カネリョウ海藻 最終面接GAMBA</h1>
  <p>江原予備校　商品開発職（熊本勤務希望）最終面接 12月1日 対策</p>
</header>
<nav id="nav" class="hide"></nav>
<main id="app"></main>

<script src="config.js"></script>
<script src="knowledge.js"></script>
<script src="questions.js"></script>
<script>
(function(){
"use strict";
var app=document.getElementById("app"), nav=document.getElementById("nav");

/* ---------- 質問データ（questions.js）を、この画面用に整える ---------- */
var CATS=[
  {k:"A",t:"入社意欲・志望度",ic:"🔥"},
  {k:"B",t:"熊本で働くこと・地震・勤務地",ic:"🌏"},
  {k:"C",t:"商品開発の仕事・会社理解",ic:"🧪"},
  {k:"D",t:"人物・価値観",ic:"🙋"},
  {k:"E",t:"将来・入社後のイメージ",ic:"🌱"},
  {k:"F",t:"想定外・やや答えにくい質問",ic:"❓"},
  {k:"G",t:"公務員との併願",ic:"⚖️"}
];
var QUESTIONS=((window.QUESTION_SETS&&window.QUESTION_SETS[0]&&window.QUESTION_SETS[0].questions)||[]).map(function(q){
  return {id:q.id,cat:String(q.cat||"").charAt(0),star:!!q.star,q:q.q,intent:q.intent||"",point:q.point||"",
    deep:String(q.follow||"").split(/／/).map(function(s){return s.trim()}).filter(Boolean),
    keywords:q.keywords||[],model:q.model||""};
});
var KATA=[
  {lb:"① 結論",guide:"聞かれたことに、最初の一文で答えます。「〜です。」"},
  {lb:"② 理由",guide:"「理由は〜です。」理由が2つなら「2つあります」と先に言います。"},
  {lb:"③ 具体例",guide:"自分の経験を一つ。特待生3年間、模擬店、研究など、数字や場面を入れます。"},
  {lb:"④ 結論・貢献",guide:"「この経験を、御社の商品づくりに生かしたいです。」で締めます。"}
];

var S={consent:false, tab:"home", cur:null, hintStep:-1, kOpen:{}, quizI:0, quizOk:0, quizAns:-1, cardI:0, quizOrder:null, mock:null, autoMode:false};
var D={answers:{}, results:{}, aihint:{}};

/* ---------- 保存（この端末のブラウザだけ） ---------- */
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var SAVE_KEY="kaneryo_final_v1";
function loadD(){try{var x=JSON.parse(store(SAVE_KEY)||"null");if(x&&x.results){D.answers=x.answers||{};D.results=x.results||{}}}catch(e){}}
function saveD(){try{store(SAVE_KEY,JSON.stringify({answers:D.answers,results:D.results}))}catch(e){}}
loadD();
function apiUrl(){return (store("kaneryo_api_url")||(typeof API_URL!=="undefined"?API_URL:"")||"").trim()}
function apiToken(){return (store("kaneryo_app_token")||(typeof APP_TOKEN!=="undefined"?APP_TOKEN:"")||"").trim()}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nl(s){return esc(s).replace(/\n/g,"<br>")}
function $(id){return document.getElementById(id)}
function each(sel,fn){Array.prototype.forEach.call(app.querySelectorAll(sel),fn)}
function count(t){return String(t||"").replace(/[\s\n　]/g,"").length}
function byId(id){for(var i=0;i<QUESTIONS.length;i++)if(QUESTIONS[i].id===id)return QUESTIONS[i]}
function cat(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i];return {k:k,t:"",ic:""}}
function qno(q){return QUESTIONS.indexOf(q)+1}
function estSec(t){return Math.round(count(t)/5)} // 1秒に約5字（1分300字）
function stars(n){var s="";for(var i=0;i<5;i++)s+=i<n?"★":"☆";return s}
function starTag(q){return '<span class="stars">'+stars(q.star?5:3)+'</span>'}

var PII=[/0\d{1,4}[-ー−\s]?\d{1,4}[-ー−\s]?\d{3,4}/, /\d{3}[-ー−]\d{4}/, /[\w.+-]+@[\w-]+\.[\w.]+/, /〒/, /(県|市|町|村)[^\s]{0,8}(\d+丁目|\d+番地|\d+-\d+)/];
function hasPII(t){for(var i=0;i<PII.length;i++)if(PII[i].test(t||""))return true;return false}

var TABS=[["home","🏠 ホーム"],["know","📘 基礎知識"],["tips","💡 面接の心得"],["list","📋 質問一覧"],["practice","🎤 練習する"],["mock","🎯 本番モード"],["record","📈 きろく"],["teacher","⚙ 先生用"]];
function drawNav(){
  nav.className=S.consent?"":"hide";
  nav.innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){b.onclick=function(){go(b.getAttribute("data-t"))}});
}
function go(t){stopAll(); S.tab=t; render(); window.scrollTo(0,0)}
function render(){
  drawNav();
  if(!S.consent){app.innerHTML=viewConsent();bindConsent();return}
  var V={home:[viewHome,bindHome],know:[viewKnow,bindKnow],tips:[viewTips,bindTips],list:[viewList,bindList],practice:[viewPractice,bindPractice],mock:[viewMock,bindMock],record:[viewRecord,bindRecord],teacher:[viewTeacher,bindTeacher]}[S.tab];
  app.innerHTML=V[0](); if(V[1])V[1]();
}

/* ---------- 同意 ---------- */
function viewConsent(){return '<div class="card warn"><h2 style="color:#b8322a">⚠️ はじめに必ずお読みください</h2>'+
 '<p><b>この画面には、氏名・住所・電話番号・メールアドレス・生年月日などの個人情報を、書かない・言わないでください。</b></p>'+
 '<ul><li>大学名・家族の名前も、ここでは言わなくて大丈夫です。「大学で」「家族が」と言いましょう。</li>'+
 '<li>マイクで話した声は、文字にするためにブラウザ（Google や Apple の音声認識）に送られます。録音した声は、あなたの端末の中だけで再生します。</li>'+
 '<li><b>「AIで採点・添削する」「AIにヒントをもらう」を押したときだけ</b>、回答の文字が、採点のためにAI（Anthropic社のClaude）に送られます。</li>'+
 '<li>答えと点数は、この端末のブラウザの中だけに保存されます（「📈 きろく」から消せます）。</li></ul></div>'+
 '<div class="card"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:700"><input type="checkbox" id="agree" style="width:24px;height:24px;margin-top:4px"> <span>上の内容を読み、個人情報は書かない・言わないことに同意します。</span></label>'+
 '<p style="margin-top:14px"><button class="btn" id="go" disabled>同意して始める</button></p></div>'}
function bindConsent(){var a=$("agree"),g=$("go");a.onchange=function(){g.disabled=!a.checked};g.onclick=function(){S.consent=true;S.tab="home";render()}}

/* ---------- ホーム ---------- */
function daysLeft(){var t=new Date(2026,11,1),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-n)/86400000)}
function viewHome(){
  var steps=[["know","📘","① 基礎知識を入れる","カネリョウ海藻の歴史・理念・事業・商品・研究、地震と会社の対応。要点カードと確認クイズ。"],
             ["tips","💡","② 面接の心得","答え方の型（PREP）、入室から退室まで、おすすめの逆質問。"],
             ["list","📋","③ 40問を1問ずつ練習","声に出して答えると、AIが採点・添削し、アドバイスと模範例を出します。★重要から。"],
             ["mock","🎯","④ 本番モード","面接官が質問を読み上げ、続けて答えます。最後にまとめて採点。"],
             ["record","📈","きろく","点数の記録。印刷して先生に見せましょう。"]];
  var done=QUESTIONS.filter(function(q){return D.results[q.id]&&D.results[q.id].length}).length;
  var dl=daysLeft();
  var sp=recogOK()?'':'<div class="tip small">このブラウザは音声入力に対応していないようです。文字で入力して練習できます。音声で練習するときは、Chrome（パソコン・Android）か、iPhone の Safari を使いましょう。</div>';
  return '<div class="card"><h2>ようこそ</h2>'+(dl>0?'<p><b style="font-size:18px;color:#b8322a">最終面接（12月1日）まで、あと '+dl+' 日</b></p>':(dl===0?'<p><b style="font-size:18px;color:#b8322a">今日は最終面接の日です。★重要の質問だけ、軽く声に出しましょう。</b></p>':''))+
  '<p>ここまで来たあなたは、すでに会社から「一緒に働けるかもしれない」と思われている人です。最終面接では、新しい自分を見せる必要はありません。ESと二次面接で話したことを、もう一度、誠実に、あなたの言葉で話しましょう。</p>'+
  '<p>まず <span class="stars">★★★★★</span> の8問（志望度と公務員との併願）から、<b>声に出して</b>答えてみましょう。</p>'+
  '<div class="progress"><i style="width:'+Math.round(done/Math.max(1,QUESTIONS.length)*100)+'%"></i></div><p class="small">採点まで終わった質問：'+done+' / '+QUESTIONS.length+'</p></div>'+sp+
  '<div class="grid two">'+steps.map(function(s){return '<button class="tile" data-go="'+s[0]+'"><span class="ic">'+s[1]+'</span><b>'+s[2]+'</b>'+s[3]+'</button>'}).join("")+'</div>'+
  (apiUrl()?'':'<div class="tip small">いまはAIにつながっていません。採点のかわりに「採点用の文章をコピー」が使えます。先生は「⚙ 先生用」から設定できます。</div>')}
function bindHome(){each("[data-go]",function(b){b.onclick=function(){go(b.getAttribute("data-go"))}})}

/* ---------- 会社の知識 ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function quizOrder(){if(!S.quizOrder)S.quizOrder=QUIZ.map(function(z){return shuffle(z.c.map(function(c,i){return i}))});return S.quizOrder}
function viewKnow(){
  return '<div class="card"><h2>📘 面接の前に入れておく基礎知識</h2><p>最終面接では、「会社をどれだけ調べてきたか」「二次面接のあとに何を知ったか」も見られます。<span class="pill must">必ず</span> の付いた項目から読みましょう。</p>'+
  '<p class="small">'+esc(KNOW_UPDATED)+'時点の会社の公表内容です。面接の前日（11月30日）に、カネリョウ海藻の公式サイトで続報がないか確認しましょう。</p>'+
  '<div class="row"><button class="btn sun sm" data-jump="quiz">✅ 確認クイズへ</button><button class="btn line sm" data-jump="cards">🃏 要点カードへ</button><button class="btn line sm" id="kAll">全部ひらく</button></div></div>'+
  KNOWLEDGE.map(function(k){var o=S.kOpen[k.id];
    return '<div class="card kn"><button class="qitem" style="border:0;padding:0" data-k="'+k.id+'"><span style="font-size:24px">'+k.ic+'</span><span style="flex:1"><b style="font-size:17px;color:var(--blue-d)">'+esc(k.t)+'</b> '+(k.must?'<span class="pill must">必ず</span>':'')+'</span><span class="small">'+(o?'▲ とじる':'▼ ひらく')+'</span></button>'+
    (o?'<ul>'+k.pts.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul>'+

/* ---------- 音声：読み上げ・音声入力・録音 ---------- */
var REC=null, recOn=false, recBase="", recTimer=null, recStart=0, recSec=0, MR=null, mrChunks=[], audioURL=null, onSpeechEnd=null;
function recogOK(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function jaVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];for(var i=0;i<v.length;i++)if(/ja/i.test(v[i].lang))return v[i];return null}
function speak(text,done){
  if(!window.speechSynthesis){if(done)done();return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=0.95;var v=jaVoice();if(v)u.voice=v;
  u.onend=function(){if(done)done()};u.onerror=function(){if(done)done()};
  speechSynthesis.speak(u);
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){};
function startRec(){
  var ta=$("ans"); if(!ta||recOn)return;
  recOn=true; recBase=ta.value?ta.value.replace(/\s+$/,"")+(ta.value.trim()?"\n":""):""; recStart=Date.now(); recSec=0;
  if(navigator.mediaDevices&&window.MediaRecorder){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      if(!recOn){st.getTracks().forEach(function(t){t.stop()});return}
      try{MR=new MediaRecorder(st)}catch(e){MR=null;return}
      mrChunks=[];MR.ondataavailable=function(e){if(e.data&&e.data.size)mrChunks.push(e.data)};
      MR.onstop=function(){st.getTracks().forEach(function(t){t.stop()});if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(mrChunks,{type:MR.mimeType||"audio/webm"}));var p=$("play");if(p){p.src=audioURL;$("playWrap").classList.remove("hide")}};
      MR.start();
    }).catch(function(){});
  }
  if(recogOK()){
    var C=window.SpeechRecognition||window.webkitSpeechRecognition; REC=new C();
    REC.lang="ja-JP";REC.continuous=true;REC.interimResults=true;
    var finalTxt="";
    REC.onresult=function(e){var interim="";for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)finalTxt+=r[0].transcript;else interim+=r[0].transcript}
      var t=$("ans");if(t){t.value=recBase+finalTxt;t.dispatchEvent(new Event("input"))}var im=$("interim");if(im)im.textContent=interim};
    REC.onerror=function(e){if(e.error==="not-allowed"){alert("マイクが使えません。ブラウザの設定で、このページのマイクを「許可」にしてください。");stopRec()}};
    REC.onend=function(){if(recOn){try{REC.start()}catch(e){}}};
    try{REC.start()}catch(e){}
  }
  recTimer=setInterval(tick,250); updRecBtn(); tick();
}
function stopRec(){
  if(!recOn)return; recOn=false;
  if(REC){try{REC.onend=null;REC.stop()}catch(e){}REC=null}
  if(MR&&MR.state!=="inactive"){try{MR.stop()}catch(e){}}
  clearInterval(recTimer);recTimer=null; recSec=Math.round((Date.now()-recStart)/1000);
  var im=$("interim");if(im)im.textContent=""; updRecBtn(); tick();
  var t=$("ans");if(t)t.dispatchEvent(new Event("input"));
  if(onSpeechEnd){var f=onSpeechEnd;onSpeechEnd=null;f()}
}
function stopAll(){if(window.speechSynthesis)speechSynthesis.cancel();if(recOn){onSpeechEnd=null;stopRec()}}
function updRecBtn(){var b=$("mic");if(!b)return;b.className="btn "+(recOn?"rec":"red");b.innerHTML=recOn?"⏹ 話し終わった":"🎤 話して答える"}
function tick(){
  var el=$("sec"); if(!el)return;
  var s=recOn?Math.round((Date.now()-recStart)/1000):(recSec||estSec(($("ans")||{}).value));
  el.textContent=s+"秒";
  var m=$("tm"),pct=Math.min(100,Math.round(s/90*100));m.style.width=pct+"%";m.className=s>75?"over":(s>=30?"good":"");
  var lb=$("tml");lb.innerHTML=recOn?(s<30?"まず結論を一文で":(s<=60?'<b style="color:#1b7d59">ちょうどよい長さ</b>':(s<=75?"そろそろまとめましょう":'<b style="color:#b8322a">長すぎます。結論で締めましょう</b>'))):
    (recSec?"話した時間":(count(($("ans")||{}).value)?"文字数からの目安（1分＝約300字）":""));
  if(recOn&&S.tab==="mock"&&s>=90)stopRec();
}

function postJSON(url,body){
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},120000);

function parseFix(t){

    if(/^FIX\s*[|｜]/.test(line)){var x=line.split(/[|｜]/);r.fixes.push({original:(x[1]||"").trim(),revised:(x[2]||"").trim(),reason:(x[3]||"").trim()})}

  '<textarea id="cpt" style="min-height:200px" readonly>'+esc(copyPrompt(c,ans))+'</textarea><p><button class="btn" id="cpb">コピーする</button></p></div>'}
function bindCopyBox(){$("cpb").onclick=function(){var x=$("cpt");x.select();
  if(navigator.clipboard)navigator.clipboard.writeText(x.value).then(function(){alert("コピーしました")},function(){document.execCommand("copy");alert("コピーしました")});else{document.execCommand("copy");alert("コピーしました")}}}

/* ---------- 本番モード ---------- */
function pickMock(kind){
  var first=QUESTIONS[0], qs=QUESTIONS.slice(1);
  if(kind==="star")qs=qs.filter(function(q){return q.star});
  qs=shuffle(qs);
  if(kind==="5")qs=qs.slice(0,5); if(kind==="10")qs=qs.slice(0,10);
  qs.unshift(first);  // 最初は志望理由
  return qs}
function viewMock(){
  var M=S.mock;
  if(!M)return '<div class="card"><h2>🎯 本番モード</h2><p>面接官が質問を読み上げます。読み終わると自動でマイクが入るので、そのまま答えて「話し終わった」を押します。90秒で自動的に止まります。最後に、まとめてAIで採点します。</p>'+
    '<div class="tip small">静かな場所で、本番と同じように背筋を伸ばして、声に出して答えましょう。スマホでも使えます。</div>'+
    '<div class="grid two"><button class="tile" data-mk="5"><span class="ic">⏱</span><b>ショート（6問）</b>志望理由＋ランダム5問。約10分。</button>'+
    '<button class="tile" data-mk="star"><span class="ic">🔥</span><b>★重要だけ（8問）</b>志望度と公務員との併願。必ず仕上げたい質問。</button>'+
    '<button class="tile" data-mk="10"><span class="ic">🏁</span><b>ロング（11問）</b>本番より少し長め。約20分。</button>'+
    '<button class="tile" data-mk="all"><span class="ic">💯</span><b>全部（'+QUESTIONS.length+'問）</b>総仕上げ。採点は問題数分かかります。</button></div></div>';
  if(M.i>=M.qs.length)return mockEndHtml();
  var q=M.qs[M.i], ans=M.ans[M.i]||"";
  return '<div class="card"><div class="row"><span class="pill">質問 '+(M.i+1)+' / '+M.qs.length+'</span></div><div class="progress"><i style="width:'+Math.round(M.i/M.qs.length*100)+'%"></i></div>'+
  '<div class="qtext" style="margin:8px 0">'+(M.hide?'<span class="small">（面接官の質問をよく聞きましょう。文字を見るには「質問を表示」）</span>':esc(q.q))+'</div>'+
  '<div class="row noprint"><button class="btn line sm" id="say">🔊 もう一度聞く</button><button class="btn line sm" id="show">'+(M.hide?'質問を表示':'質問をかくす')+'</button></div></div>'+
  '<div class="card"><div class="row"><button class="btn red" id="mic">🎤 話して答える</button><button class="btn sun sm" id="mhint">💡 詰まったら</button></div>'+
  '<div class="timebox"><span class="sec" id="sec">0秒</span><div class="meter"><i id="tm"></i></div><span id="tml" class="small"></span></div>'+
  '<div class="interim" id="interim"></div><textarea id="ans" style="min-height:120px">'+esc(ans)+'</textarea><div class="row"><span class="small" id="acn"></span></div>'+
  '<div id="hintArea"></div>'+
  '<p><button class="btn" id="mnext">'+(M.i<M.qs.length-1?'次の質問へ →':'面接終了 → 採点へ')+'</button> <button class="btn line sm" id="mquit">やめる</button></p></div>'}
function bindMock(){
  var M=S.mock;
  if(!M){each("[data-mk]",function(b){b.onclick=function(){S.mock={qs:pickMock(b.getAttribute("data-mk")),i:0,ans:[],sec:[],res:[],hide:true};render();mockAsk()}});return}
  if(M.i>=M.qs.length){bindMockEnd();return}
  var q=M.qs[M.i], ta=$("ans");
  S.cur={q:q,parent:null,key:"mock"};
  ta.oninput=function(){M.ans[M.i]=ta.value;updCount()};updCount();recSec=M.sec[M.i]||0;tick();
  $("say").onclick=function(){mockAsk()};
  $("show").onclick=function(){M.hide=!M.hide;M.ans[M.i]=ta.value;render()};
  $("mic").onclick=function(){if(recOn)stopRec();else{if(window.speechSynthesis)speechSynthesis.cancel();startRec()}};
  $("mhint").onclick=function(){S.hintStep=2;showHint()};
  $("mnext").onclick=function(){if(recOn)stopRec();M.ans[M.i]=ta.value;M.sec[M.i]=recSec;M.i++;render();window.scrollTo(0,0);if(M.i<M.qs.length)mockAsk()};
  $("mquit").onclick=function(){if(confirm("本番モードをやめます。よろしいですか？")){stopAll();S.mock=null;render()}};
}
function mockAsk(){var M=S.mock;if(!M||M.i>=M.qs.length)return;speak(M.qs[M.i].q,function(){if(S.tab==="mock"&&S.mock===M&&$("mic")&&!recOn)startRec()})}
function mockEndHtml(){
  var M=S.mock;
  return '<div class="card"><h2>🎯 おつかれさまでした！</h2><p>'+M.qs.length+'問に答えました。「まとめて採点」を押すと、1問ずつAIが採点・添削します（1問30秒〜1分）。</p>'+
  '<p><button class="btn mint" id="mgrade">✅ まとめて採点する</button> <button class="btn line" id="mnew">もう一度（新しい質問で）</button></p><div id="mprog"></div></div>'+
  M.qs.map(function(q,i){var r=M.res[i];
    return '<div class="card"><div class="qhead"><span class="qno">'+(i+1)+'</span><div style="flex:1"><b>'+esc(q.q)+'</b><div class="small">あなたの答え（'+count(M.ans[i])+'字'+(M.sec[i]?'・'+M.sec[i]+'秒':'')+'）：</div><div>'+(M.ans[i]?nl(M.ans[i]):'<span class="small">（答えなし）</span>')+'</div>'+
    (r?(r.error?errBox(r.error):'<div class="score" style="margin-top:6px"><div class="big" style="font-size:34px;color:'+(r.score>=70?'#1b7d59':(r.score>=55?'#a07400':'#b8322a'))+'">'+r.score+'<small> 点</small></div><span class="lv '+level(r.score)[0]+'">'+level(r.score)[1]+'</span></div>'+
      '<details><summary class="btn line sm" style="display:inline-block">総評・添削・模範例を見る</summary><div class="hyouka" style="margin-top:6px">'+nl(r.hyouka)+'</div>'+
      (r.fixes&&r.fixes.length?r.fixes.map(function(f){return '<div class="fix"><div class="o">'+esc(f.original)+'</div><div class="r">→ '+esc(f.revised)+'</div><div class="small">'+esc(f.reason)+'</div></div>'}).join(""):'')+
      (arr(r.advice).length?'<div class="tip small"><ul style="margin:0 0 0 18px;padding:0">'+arr(r.advice).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>':'')+(r.model?'<div class="model">'+esc(r.model)+'</div>':'')+(r.deep?'<div class="deepbox small"><b>追撃質問：</b>'+esc(r.deep)+'</div>':'')+'</details>'):'')+
    '</div></div></div>'}).join("")}
function bindMockEnd(){
  var M=S.mock;
  $("mnew").onclick=function(){S.mock=null;render()};
  $("mgrade").onclick=function(){
    if(!apiUrl()){alert("いまはAIにつながっていません。1問ずつ「📋 質問一覧」から練習すると、採点用の文章をコピーできます。");return}
    var btn=this;btn.disabled=true;var i=0;
    (function next(){
      while(i<M.qs.length&&(M.res[i]&&!M.res[i].error||count(M.ans[i])<10))i++;
      if(i>=M.qs.length){var mp=$("mprog");if(mp)mp.innerHTML='<div class="ok">採点が終わりました。</div>';var mg=$("mgrade");if(mg)mg.disabled=false;return}
      var mp2=$("mprog");if(mp2)mp2.innerHTML='<div class="loading"><span class="spin"></span>'+(i+1)+'問目を採点しています…</div>';
      var q=M.qs[i],k=i;
      aiGrade(payload({q:q,parent:null},M.ans[k],M.sec[k])).then(function(d){
        if(d&&d.result){M.res[k]=d.result;(D.results[q.id]=D.results[q.id]||[]).push({score:d.result.score,time:Date.now(),chars:count(M.ans[k]),sec:M.sec[k],answer:M.ans[k],q:q.q,parent:"",r:d.result,mock:true});saveD()}
        else M.res[k]={error:(d&&d.error)||"エラー"};
        i++; if(S.tab!=="mock"||S.mock!==M)return; var y=window.scrollY; render(); window.scrollTo(0,y); var mg=$("mgrade");if(mg)mg.disabled=true; next();
      });
    })();
  };
}

/* ---------- きろく ---------- */
function viewRecord(){
  var rows=[];Object.keys(D.results).forEach(function(k){D.results[k].forEach(function(r){rows.push(r)})});
  rows.sort(function(a,b){return new Date(a.time)-new Date(b.time)});
  var avg=rows.length?Math.round(rows.reduce(function(a,b){return a+b.score},0)/rows.length):null;
  return '<div class="card"><h2>📈 きろく</h2><p class="small">採点の記録は、この端末のブラウザに保存されています。印刷するかテキスト保存して、先生に見せましょう。</p>'+
  (rows.length?'<p>採点した回数：<b>'+rows.length+'</b>回　平均：<b>'+avg+'</b>点</p><table class="bd"><tr><th>日時</th><th>質問</th><th>長さ</th><th>点数</th></tr>'+rows.map(function(r){
    return '<tr><td>'+tstr(r.time)+'</td><td>'+(r.parent?'<span class="small">（追撃）</span>':'')+(r.mock?'<span class="small">（本番）</span>':'')+esc(r.q)+'</td><td>'+r.chars+'字'+(r.sec?'<br>'+r.sec+'秒':'')+'</td><td><b>'+r.score+'</b>点</td></tr>'}).join("")+'</table>':'<p>まだ採点した答えはありません。</p>')+
  '<h3>質問ごとの最高点</h3><table class="bd"><tr><th>質問</th><th>最高点</th></tr>'+QUESTIONS.map(function(q){var b=best(q.id);return '<tr><td>Q'+qno(q)+'. '+esc(q.q)+(q.star?' ★':'')+'</td><td>'+(b===null?'―':'<b>'+b+'</b>点')+'</td></tr>'}).join("")+'</table>'+
  '<p class="noprint"><button class="btn" id="kpr">🖨 印刷する</button> <button class="btn line" id="ktx">全部テキスト保存</button> <button class="btn line sm" id="kdel">記録と答えを全部消す</button></p></div>'}
function bindRecord(){
  $("kpr").onclick=function(){window.print()};
  $("ktx").onclick=function(){var a=[];Object.keys(D.results).forEach(function(k){D.results[k].forEach(function(r){a.push(resultText(r))})});download(a.join("\n\n――――――――――\n\n")||"（記録なし）","kaneryo-kiroku.txt")};
  $("kdel").onclick=function(){if(!confirm("この端末に保存した答えと点数を、全部消します。よろしいですか？"))return;D.answers={};D.results={};D.aihint={};store(SAVE_KEY,null);render()};
}

/* ---------- 先生用 ---------- */
function viewTeacher(){
  var u=apiUrl(), fromCfg=(typeof API_URL!=="undefined"&&API_URL)?true:false;
  return '<div class="card"><h2>⚙ 先生用：AIの設定</h2>'+
  '<p>いまの状態：'+(u?'<b style="color:#1b7d59">AIにつながる設定があります</b><br><span class="small" style="word-break:break-all">'+esc(u)+'</span>':'<b style="color:#b8322a">AIの設定がありません</b>（生徒が採点を押すと「採点用の文章をコピー」が出ます）')+'</p>'+
  '<div class="tip small">ふつうは <b>config.js</b> にURLを書いておけば、生徒は何も設定しなくてよくなります。ここで入力した場合は、<b>この端末のこのブラウザだけ</b>に保存されます。お試し用です。</div>'+
  '<label>AI採点の接続先URL（gamba-api）</label><input type="text" id="tu" value="'+esc(store("kaneryo_api_url")||"")+'" placeholder="'+esc(fromCfg?API_URL:"https://gamba-api.kogentext.workers.dev")+'">'+
  '<label>合言葉（APP_TOKEN を設定した場合だけ）</label><input type="text" id="tt" value="'+esc(store("kaneryo_app_token")||"")+'">'+
  '<p><button class="btn" id="tsave">この端末に保存</button> <button class="btn line" id="tdel">この端末の設定を消す</button> <button class="btn sun" id="ttest">つながるか試す</button></p>'+
  '<div id="tres"></div></div>'+
  '<div class="card"><h2>しくみ・費用について</h2><ul>'+
  '<li>Claude のAPIキーは、<b>このアプリには書きません</b>。いつもの gamba-api（Cloudflare）のシークレットに入っているものを、これまでの「ai_chat」の入口から使います。gamba-api の書き換えは不要です。</li>'+
  '<li>採点1回で、AIに2回たずねます（①採点・総評 ②添削・アドバイス・模範例）。gamba-api の上限は「同じ回線から1時間40回」なので、1時間に約20回まで採点できます。上限に当たると「混み合っています」と出ます。</li>'+
  '<li>費用の目安は、採点1回あたりおよそ5〜10円、AIヒント1回でおよそ3円です。本番モードのまとめて採点は、問題数分かかります。</li></ul></div>'}
function bindTeacher(){
  $("tsave").onclick=function(){store("kaneryo_api_url",$("tu").value.trim()||null);store("kaneryo_app_token",$("tt").value.trim()||null);render()};
  $("tdel").onclick=function(){store("kaneryo_api_url",null);store("kaneryo_app_token",null);render()};
  $("ttest").onclick=function(){
    var u=$("tu").value.trim()||apiUrl(); if(!u){$("tres").innerHTML=errBox("URLが入っていません。");return}
    $("tres").innerHTML='<div class="loading"><span class="spin"></span>確認中…</div>';
    postJSON(u,{action:"ai_chat",systemPrompt:"「つながりました」とだけ答えてください。",messages:[{role:"user",content:"接続テスト"}]}).then(function(d){
      if(d&&d.reply&&/つながりました/.test(d.reply))$("tres").innerHTML='<div class="ok">✓ gamba-api につながりました。AI採点を使えます。</div>';
      else $("tres").innerHTML=errBox((d&&(d.reply||d.error))||"つながりませんでした。このアプリを realizefield.github.io に置いてから試してください（gamba-api は、許可したサイトからしか使えません）。");
    });
  };
}

function download(text,name){var b=new Blob([text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a)}

render();
})();
</script>
